name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: Host Crate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run host crate clippy
        run: cargo clippy --workspace --exclude nexus-kernel --all-targets -- -D warnings

      - name: Run host crate tests
        run: cargo test --workspace --exclude nexus-kernel

  kernel-check:
    name: Kernel Check (x86_64-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with x86_64-unknown-none
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-kernel-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kernel-

      - name: Check kernel target
        run: cargo check -p nexus-kernel --target x86_64-unknown-none

      - name: Run kernel clippy
        run: cargo clippy -p nexus-kernel --target x86_64-unknown-none -- -D warnings

  qemu-boot:
    name: QEMU Boot Test (x86_64)
    runs-on: ubuntu-latest
    needs: kernel-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with x86_64-unknown-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-kernel-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kernel-

      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso mtools git

      - name: Build nexus-kernel
        run: cargo build -p nexus-kernel --target x86_64-unknown-none

      - name: Fetch and build Limine (v8.x-binary)
        run: |
          rm -rf target/limine
          git clone --depth=1 --branch=v8.x-binary https://github.com/limine-bootloader/limine.git target/limine
          make -C target/limine

      - name: Build bootable ISO
        run: |
          rm -rf target/iso
          mkdir -p target/iso/boot/limine target/iso/EFI/BOOT
          cp target/x86_64-unknown-none/debug/nexus-kernel target/iso/boot/nexus-kernel
          cat > target/iso/boot/limine/limine.conf <<'EOF'
          timeout: 0

          /Nexus OS
              protocol: limine
              path: boot():/boot/nexus-kernel
          EOF
          cp target/limine/limine-bios.sys \
             target/limine/limine-bios-cd.bin \
             target/limine/limine-uefi-cd.bin \
             target/iso/boot/limine/
          cp target/limine/BOOTX64.EFI target/iso/EFI/BOOT/
          xorriso -as mkisofs -R -r -J -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table -hfsplus \
            -apm-block-size 2048 --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            target/iso -o target/nexus-os.iso
          target/limine/limine bios-install target/nexus-os.iso

      - name: Boot in QEMU and verify serial output
        run: |
          timeout 15s qemu-system-x86_64 \
            -M q35 \
            -m 256M \
            -cdrom target/nexus-os.iso \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown > serial.log 2>&1 || true
          if ! grep -q "Nexus OS microkernel booting" serial.log || ! grep -q "Nexus OS early boot complete" serial.log; then
            echo "QEMU boot test failed! Serial output:"
            cat serial.log
            exit 1
          fi
          echo "QEMU boot test passed!"
          cat serial.log
