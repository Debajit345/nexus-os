[workspace]
resolver = "2"
members = [
    "crates/nexus-abi",
    "crates/nexus-elf",
    "crates/nexus-pe",
    "crates/nexus-macho",
    "crates/nexus-gfx",
    "crates/nexus-shell",
    "crates/nexus-compat",
    "crates/nexus-desktop",
    "crates/nexus-init",
    "crates/nexus-pkg",
    "crates/nexus-gpu-bridge",
    "crates/nexus-fs",
    "kernel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Nexus OS Contributors"]
repository = "https://github.com/Debajit345/nexus-os"
