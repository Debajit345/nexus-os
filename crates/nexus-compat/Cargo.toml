[package]
name = "nexus-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified ELF64, PE32+, and Mach-O 64-bit binary inspection and multi-personality syscall translation for Nexus OS"

[features]
default = []
std = ["nexus-abi/std", "nexus-elf/std", "nexus-pe/std", "nexus-macho/std"]

[dependencies]
nexus-abi = { path = "../nexus-abi" }
nexus-elf = { path = "../nexus-elf" }
nexus-pe = { path = "../nexus-pe" }
nexus-macho = { path = "../nexus-macho" }
